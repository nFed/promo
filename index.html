// תפריט מצומצם: חמישה סעיפים
const NAV = [
  { id: "story", t: "הסרט" },
  { id: "screening", t: "ההקרנה" },
  { id: "director", t: "הבמאי" },
  { id: "gallery", t: "גלריה" },
  { id: "press", t: "עיתונות" },
];

/* ============================================================
   עזרים משותפים
   ============================================================ */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const S = CONTENT.screening;
const M = CONTENT.media;
// מצב "אחרי ההקרנה": שעתיים אחרי תחילת ההקרנה כפתורי הכרטיסים ופס הכרטיסים יורדים מהדף
const PAST = S.past === true || Date.now() > new Date(S.iso).getTime() + 2 * 36e5;
const NEW_WIN = `<span class="vh"> (נפתח בחלון חדש)</span>`;
const ltr = (s) => `<span class="ltr">${s}</span>`;
// טווח התאריכים של הפסטיבל: המספרים כיחידה אחת שלא נשברת ולא מתהפכת
const festivalDatesHtml = () => S.festivalDates.replace(/^([\d.–-]+)/, (m) => ltr(m));

function gcalLink() {
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: "האגר – ארץ: הקרנה בפסטיבל הסרטים הבינלאומי חיפה",
    dates: "20260929T153000Z/20260929T173000Z",
    details: "תחרות הקולנוע הישראלי, פסטיבל חיפה ה־42. בנוכחות הבמאי שמואל ברו, השחקנים וצוות ההפקה.",
    location: "מרכז רפפורט לתרבות, שד' הנשיא 140, חיפה",
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

const navLinks = () => NAV.map((n) => `<li><a href="#${n.id}">${n.t}</a></li>`).join("");
const brand = (cls = "brand") => `<a class="${cls}" href="#top">${CONTENT.fullTitle}</a>`;
const titleLockup = (cls = "title") => `<h1 class="${cls}">${CONTENT.title} <span class="t2">${CONTENT.subtitle}</span></h1>`;
const amharicSub = (cls = "sub") => `<p class="${cls}"><span class="am" lang="am">${CONTENT.titleAmharic}</span><span>${CONTENT.amharicNote}</span></p>`;
const ticketBtn = (cls = "btn", label = "לרכישת כרטיסים") => (PAST ? "" : `<a class="${cls}" href="${S.ticketsUrl}" target="_blank" rel="noopener">${label}${NEW_WIN}</a>`);
const calBtn = (cls = "btn ghost") => (PAST ? "" : `<a class="${cls}" href="${gcalLink()}" target="_blank" rel="noopener">הוספה ליומן${NEW_WIN}</a>`);
const trailerBtn = (cls = "btn ghost", label = "לטריילר") => (M.trailerUrl ? `<a class="${cls}" href="${esc(M.trailerUrl)}" target="_blank" rel="noopener">${label}${NEW_WIN}</a>` : "");
const whenLine = () => (PAST ? `הוקרן ב${S.festivalShort}, ${S.weekday} ${S.date}` : `${S.weekday} ${S.date}, ${S.time}`);
const skipLink = () => `<a class="skip" href="#story">דילוג לתוכן</a>`;

function menuBtn() {
  return `<button class="mnav-btn" type="button" aria-controls="mnav" aria-expanded="false" aria-haspopup="dialog"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>תפריט</button>`;
}
function mobileMenu(btn = "btn") {
  return `<div class="mnav" id="mnav" role="dialog" aria-modal="true" aria-label="תפריט" tabindex="-1">
    <div class="mnav-head"><span class="mnav-brand">${CONTENT.fullTitle}</span><button class="mnav-close" type="button">סגירה</button></div>
    <nav aria-label="ניווט ראשי"><ul>${navLinks()}</ul></nav>
    <div class="mnav-cta"><p class="mnav-when">${whenLine()}<br>${S.festivalShort}, ${S.section}</p>${trailerBtn(btn + " ghost")}${ticketBtn(btn, "כרטיסים להקרנה")}</div>
  </div>`;
}
function ticketBar(btn = "btn") {
  if (PAST) return "";
  return `<div class="ticket-bar"><span>${S.weekday} ${S.date}, ${S.time}<br><small>${S.festivalShort}</small></span>${ticketBtn(btn, "כרטיסים")}</div>`;
}
function navHtml({ btn = "btn", label = "כרטיסים" } = {}) {
  return `${skipLink()}<header class="nav"><div class="wrap">${brand()}<nav class="desk-links" aria-label="ניווט ראשי"><ul class="scroll-x">${navLinks()}</ul></nav>${ticketBtn(btn, label)}${menuBtn()}</div></header>`;
}

function directorPhoto(cls = "dphoto") {
  if (M.directorPhoto) return `<img class="${cls}" src="${esc(M.directorPhoto)}" alt="שמואל ברו על הסט" loading="lazy">`;
  return `<div class="${cls} ph" role="img" aria-label="תמונת הבמאי — תתווסף"><span>תמונה<br>שמואל ברו</span></div>`;
}
const directorCredit = () => (M.directorPhoto && M.directorPhotoCredit ? `<p class="credit">${M.directorPhotoCredit}</p>` : "");
function pressPhotos() {
  const items = [];
  if (M.pressPortrait) items.push(`<figure><img src="${esc(M.pressPortrait)}" alt="שמואל ברו" loading="lazy"><figcaption>שמואל ברו. ${M.pressPortraitCredit}</figcaption></figure>`);
  if (M.poster) items.push(`<figure><img src="${esc(M.poster)}" alt="פוסטר הסרט" loading="lazy"><figcaption>הפוסטר הרשמי</figcaption></figure>`);
  return items.length ? `<div class="press-photos">${items.join("")}</div>` : "";
}
function trailerNote() {
  if (M.trailerUrl) return `<p class="note">${trailerBtn("btn", "לצפייה בטריילר")}</p>`;
  return `<p class="note">הטריילר יתווסף כאן כשיהיה מוכן.</p>`;
}
function stills(cls = "still", start = 0, count = 12) {
  return Array.from({ length: count }, (_, k) => {
    const i = start + k;
    const s = M.stills[i];
    if (s) return `<figure class="${cls}"><img src="${esc(s.src)}" alt="${esc(s.alt || "")}" loading="lazy"><figcaption>${esc(s.cap || "")}</figcaption></figure>`;
    return `<div class="${cls} ph" role="img" aria-label="סטיל ${i + 1} מהסרט"><span>סטיל ${i + 1}<br>מתוך הסרט</span></div>`;
  }).join("");
}
const stillsCredit = () => (M.stills.length ? `<p class="credit">${M.stillsCredit}</p>` : "");
// שעון ספירה לאחור: כמו שעון דיגיטלי, משמאל לימין — ימים : שעות : דקות : שניות
let countId = 0;
function countdown(cls = "count") {
  if (PAST) return `<p class="count-wrap past">ההקרנה בפסטיבל התקיימה. ${CONTENT.release}.</p>`;
  const id = "count-lbl-" + (++countId);
  const cell = (k, l) => `<div><b data-${k}>–</b> <span>${l}</span></div>`;
  return `<div class="count-wrap"><span class="count-label" id="${id}">ההקרנה בעוד</span><div class="${cls}" data-countdown dir="ltr" role="timer" aria-labelledby="${id}">${cell("d", "ימים")}<i aria-hidden="true">:</i>${cell("h", "שעות")}<i aria-hidden="true">:</i>${cell("m", "דקות")}<i aria-hidden="true">:</i>${cell("s", "שניות")}</div></div>`;
}
const facts = (cls = "facts") => `<dl class="${cls}">${CONTENT.facts.map((f) => `<div><dt>${f.k}</dt><dd>${/^\d/.test(f.v) && /–/.test(f.v) ? ltr(f.v) : f.v}</dd></div>`).join("")}</dl>`;
const stats = (cls = "stats") => `<ul class="${cls}">${CONTENT.context.stats.map((s) => `<li><b>${s.n}</b> <span>${s.t}</span></li>`).join("")}</ul>`;
const timeline = (cls = "tl") => `<ol class="${cls}">${CONTENT.context.timeline.map((t) => `<li><span class="yr">${t.year}</span><div><strong>${t.title}</strong><p>${t.text}</p></div></li>`).join("")}</ol>`;
const highlights = (cls = "hl") => `<ul class="${cls}">${CONTENT.production.highlights.map((h) => `<li><h3>${h.h}</h3><p>${h.p}</p></li>`).join("")}</ul>`;
const filmography = (cls = "filmo") => `<ol class="${cls}">${CONTENT.directorBio.filmography.map((f) => `<li><span class="yr">${f.year}</span><div><strong>${f.title}</strong><br><span>${f.note}</span></div></li>`).join("")}</ol>`;
const castNames = (cls = "cast") => `<ul class="${cls}">${CONTENT.cast.map((c) => `<li>${c}</li>`).join("")}<li>${CONTENT.castNote}</li></ul>`;
const crew = (cls = "crew") => `<dl class="${cls}">${CONTENT.crew.map((c) => `<div><dt>${c.k}</dt><dd>${c.v}</dd></div>`).join("")}</dl>`;
const contacts = (cls = "contacts") => `<ul class="${cls}">${CONTENT.press.contacts.map((c) => `<li><b>${c.name}</b><span>${c.role}</span></li>`).join("")}</ul>`;
const readMore = (label, html) => `<details class="more"><summary>${label}</summary><div class="more-body">${html}</div></details>`;
const pressDetails = () => readMore("ההודעה לעיתונות המלאה", `<p>${CONTENT.press.releaseText}</p>`);
const supporters = () => CONTENT.supporters.map((s) => `<div>${s}</div>`).join("");

// ---- בלוקים מצומצמים: תמצית גלויה, השאר מאחורי "קראו עוד" ----
function storyBlock() {
  const [p1, ...rest] = CONTENT.synopsis.paras;
  return `<p class="lead">${CONTENT.synopsis.lead}</p><p>${p1}</p>${readMore("הסינופסיס המלא", rest.map((p) => `<p>${p}</p>`).join("") + `<p class="pull-sm">${CONTENT.synopsis.pull}</p>`)}`;
}
const contextBlock = () => `<p class="lead">${CONTENT.context.intro}</p><p class="memorial">${CONTENT.context.toll}</p>${stats()}${readMore("ציר הזמן המלא", timeline())}`;
const productionBlock = () => `<p class="lead">${CONTENT.production.intro}</p>${readMore("עוד על ההפקה", highlights() + `<p class="quote">${CONTENT.production.quote}</p>`)}`;
function directorBlock() {
  const [p1, ...rest] = CONTENT.directorBio.paras;
  return `<p>${p1}</p>${filmography()}${readMore("הביוגרפיה המלאה", rest.map((p) => `<p>${p}</p>`).join(""))}`;
}
const pressBlock = () => `<p>${CONTENT.press.intro}</p>${contacts()}${pressPhotos()}<p>${CONTENT.press.kitNote}</p>${pressDetails()}`;
const footerCopy = () => `${CONTENT.fullTitle}, ${CONTENT.facts[0].v}, ${CONTENT.facts[1].v}. © 2026 כל הזכויות שמורות.`;

/* ============================================================
   העמוד. המחלקה d6 נשארה מתקופת הבחירה בין עיצובים ("בין שתי ארצות")
   ============================================================ */
function renderPage() {
  const beats = CONTENT.beats.map((b, i) => `<section class="beat" aria-label="${b.t}"><img src="${MEDIA[b.key]}" alt="${esc(b.alt)}" loading="lazy"><div class="cap reveal"><small>${b.t}</small><p>${b.p}</p></div></section>`).join("");
  return `<div class="d6" id="top">
${navHtml()}${mobileMenu()}
<section class="hero" aria-label="פתיח">
  <div class="half earth"><img src="${M.feature.earth}" alt=""><span class="lbl">האדמה</span></div>
  <div class="half zion"><img src="${M.feature.zion}" alt=""><span class="lbl">הארץ</span></div>
  <div class="seam" aria-hidden="true"></div>
  <div class="hero-title">
    <p class="kicker">${CONTENT.kicker}</p>
    ${titleLockup()}
    ${amharicSub()}
    <p class="hero-line">${CONTENT.tagline}</p>
    <p class="hero-when"><strong>${whenLine()}</strong><span>${S.section}, ${S.festivalShort}</span>${PAST ? "" : `<span class="note">${S.note}</span>`}</p>
    <div class="actions">${trailerBtn("btn")}${ticketBtn("btn", "כרטיסים להקרנה")}${calBtn()}</div>
  </div>
</section>
<div class="weave" aria-hidden="true"></div>
<main>

<section class="sec" id="story"><div class="wrap narrow">
  <h2>הסיפור</h2>
  <div class="prose">${storyBlock()}</div>
</div></section>

${beats}

<section class="sec" id="context"><div class="wrap narrow">
  <h2>הפרק שלא סופר</h2>
  ${contextBlock()}
</div></section>

<section class="sec screening-sec" id="screening"><div class="wrap">
  <h2>ההקרנה בפסטיבל</h2>
  <div class="screening-grid">
    <div>
      <div class="big">${S.weekday},<br>${S.date}</div>
      <p><strong>בשעה ${S.time}</strong>, ${S.festival}, ${S.section}</p>
      <div class="actions start">${ticketBtn("btn", "לרכישת כרטיסים")}${calBtn()}</div>
      ${countdown()}
    </div>
    <div>
      <p><strong>${S.venue}</strong><br>${S.venueNote}</p>
      <p>${S.note}.</p>
      <p class="past-hide">כרטיסים באתר הפסטיבל או בטלפון <a href="${S.phoneHref}">${S.phone}</a>. <a href="${S.icsFile}" type="text/calendar">קובץ יומן (${ltr(".ics")})</a></p>
      <p>הפסטיבל: ${festivalDatesHtml()}.</p>
    </div>
  </div>
  ${facts()}
</div></section>

<section class="sec" id="director"><div class="wrap">
  <hgroup><h2>${CONTENT.directorBio.name}</h2><p>${CONTENT.directorBio.role}</p></hgroup>
  <div class="director"><div>${directorPhoto()}${directorCredit()}</div><div class="prose">${directorBlock()}</div></div>
</div></section>

<section class="sec" id="production"><div class="wrap narrow">
  <h2>מאחורי הקלעים</h2>
  ${productionBlock()}
</div></section>

<section class="sec" id="cast"><div class="wrap">
  <h2>שחקנים וצוות</h2>
  <div class="credits"><div>${castNames()}</div><div>${crew()}</div></div>
</div></section>

<section class="sec" id="gallery"><div class="wrap">
  <hgroup><h2>גלריה</h2><p>סטילס מתוך הסרט</p></hgroup>
  ${trailerNote()}
  <div class="gallery">${stills("still")}</div>
  ${stillsCredit()}
</div></section>

<section class="sec press" id="press"><div class="wrap">
  <hgroup><h2>עיתונות</h2><p>${CONTENT.press.company}</p></hgroup>
  ${pressBlock()}
</div></section>
</main>

<div class="weave" aria-hidden="true"></div>
<footer class="footer"><div class="wrap">
  <div><div class="release">${CONTENT.release}</div></div>
  <div><b>הפקה</b><div>זדפילמס, ליו הפקות</div><b style="margin-top:1rem">בתמיכת</b>${supporters()}</div>
  <div class="copy">${footerCopy()}</div>
</div></footer>
${ticketBar()}
</div>`;
}

  let timer = null;

  // דוגמת האריג כ־SVG מוטמע
  const tibeb = `<svg xmlns='http://www.w3.org/2000/svg' width='48' height='18' viewBox='0 0 48 18'>
    <rect width='48' height='18' fill='#25325A'/>
    <rect y='0' width='48' height='1.6' fill='#F8F4EA' opacity='.75'/>
    <rect y='16.4' width='48' height='1.6' fill='#F8F4EA' opacity='.75'/>
    <path d='M12 2.5 L19 9 L12 15.5 L5 9 Z' fill='#E3A82C'/>
    <path d='M12 6.5 L14.5 9 L12 11.5 L9.5 9 Z' fill='#25325A'/>
    <path d='M36 2.5 L43 9 L36 15.5 L29 9 Z' fill='#A63D2F'/>
    <path d='M36 6.5 L38.5 9 L36 11.5 L33.5 9 Z' fill='#F8F4EA'/>
    <circle cx='24' cy='9' r='1.7' fill='#F8F4EA'/><circle cx='0' cy='9' r='1.7' fill='#F8F4EA'/>
  </svg>`;
  document.documentElement.style.setProperty("--tibeb", `url("data:image/svg+xml,${encodeURIComponent(tibeb.replace(/\s+/g, " "))}")`);

  // שעון: מחושב מהמועד המדויק (שעון ישראל, UTC+3) בכל מכשיר, מתעדכן כל שנייה
  function startCountdown() {
    clearInterval(timer);
    const target = new Date(S.iso).getTime();
    const pad = (n) => String(n).padStart(2, "0");
    const tick = () => {
      const els = app.querySelectorAll("[data-countdown]");
      if (!els.length) return;
      const diff = target - Date.now();
      els.forEach((el) => {
        if (diff <= 0) { if (!el.dataset.done) { el.dataset.done = "1"; el.innerHTML = `<div class="past" dir="rtl">ההקרנה בפסטיבל התקיימה. ${CONTENT.release}.</div>`; const l = el.parentElement && el.parentElement.querySelector(".count-label"); if (l) l.remove(); } return; }
        const d = Math.floor(diff / 864e5), h = Math.floor((diff % 864e5) / 36e5), m = Math.floor((diff % 36e5) / 6e4), s = Math.floor((diff % 6e4) / 1000);
        el.querySelector("[data-d]").textContent = d;
        el.querySelector("[data-h]").textContent = pad(h);
        el.querySelector("[data-m]").textContent = pad(m);
        el.querySelector("[data-s]").textContent = pad(s);
      });
      if (diff <= 0) clearInterval(timer);
    };
    tick();
    timer = setInterval(tick, 1000);
  }

  // תפריט מובייל: העברת פוקוס, נעילת הרקע (inert) ונעילת גלילה שעובדת גם ב־iOS
  let lastFocus = null, menuScrollY = 0;
  const setInert = (on) => { const root = app.firstElementChild; if (!root) return; [...root.children].forEach((el) => { if (el.id !== "mnav") el.inert = on; }); };
  function openMenu(btn) {
    if (document.body.classList.contains("menu-open")) return;
    lastFocus = btn; menuScrollY = window.scrollY;
    document.body.style.top = -menuScrollY + "px";
    document.body.classList.add("menu-open");
    btn.setAttribute("aria-expanded", "true");
    setInert(true);
    const c = app.querySelector(".mnav-close"); if (c) c.focus();
  }
  function closeMenu() {
    if (!document.body.classList.contains("menu-open")) return;
    document.body.classList.remove("menu-open");
    document.body.style.top = "";
    setInert(false);
    window.scrollTo(0, menuScrollY);
    const b = app.querySelector(".mnav-btn"); if (b) b.setAttribute("aria-expanded", "false");
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    lastFocus = null;
  }
  app.addEventListener("click", (e) => {
    const open = e.target.closest(".mnav-btn");
    if (open) openMenu(open);
    else if (e.target.closest(".mnav-close") || e.target.closest(".mnav a")) closeMenu();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
  // לכידת פוקוס בתוך התפריט (Tab / Shift+Tab)
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Tab" || !document.body.classList.contains("menu-open")) return;
    const m = app.querySelector("#mnav"); if (!m) return;
    const f = [...m.querySelectorAll("a[href], button:not([disabled])")]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // פס הכרטיסים הדביק (מובייל): נדלק אחרי שהפתיח, כולל כפתוריו, עבר למעלה (במסך הראשון יש כפתור בניווט).
  // צופים בפתיח כולו ולא רק בכפתורים: הוא תמיד על המסך בטעינה, כך שגם קפיצה ישירה לעוגן (בלי גלילה חלקה) מדליקה את הפס
  function setupBar() {
    if (!app.querySelector(".ticket-bar")) return; // אחרי ההקרנה אין פס
    const hero = app.querySelector(".hero");
    if (!hero || !("IntersectionObserver" in window)) { document.body.classList.add("show-bar"); return; }
    new IntersectionObserver(([en]) => document.body.classList.toggle("show-bar", !en.isIntersecting && en.boundingClientRect.top < 0)).observe(hero);
  }

  // חשיפה עדינה של כיתובי הפעימות
  function setupReveal() {
    const els = app.querySelectorAll(".reveal");
    if (!els.length || !("IntersectionObserver" in window)) return; // בלי IO הכיתובים פשוט גלויים
    document.documentElement.classList.add("reveal-js");
    const observer = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); observer.unobserve(en.target); } }), { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    els.forEach((el) => observer.observe(el));
  }

  if (PAST) document.body.classList.add("is-past");
  // מקף עברי לפני ספרה לא נשבר לשורה (WORD JOINER)
  app.innerHTML = renderPage().replace(/־(?=\d)/g, "־⁠");
  for (const step of [startCountdown, setupBar, setupReveal]) { try { step(); } catch (err) { console.error("[hager]", err); } }
})();
</script>

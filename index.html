/* Layout: full-bleed 3D canvas; floating plan-sheet cards at the corners, room bar along the bottom edge */
:root{

  --accent:#8fbcd0;--accent-ink:#0d1a20;--map-floor:#2a2e31;--map-room:#33505d;--map-wall:#e6e3dd;--map-furn:#5a5f62;color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#8fbcd0;--accent-ink:#0d1a20;--map-floor:#2a2e31;--map-room:#33505d;--map-wall:#e6e3dd;--map-furn:#5a5f62;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#c:active{cursor:grabbing}
.ui{position:fixed;inset:0;pointer-events:none;font-size:14px}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.12)}

}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
const loading=document.getElementById('loading');
if(!window.THREE){loading.textContent='לא הצלחתי לטעון את מנוע התלת-ממד. נסו לרענן את הדף.';return;}
if(THREE.ColorManagement) THREE.ColorManagement.legacyMode=false;

const S=0.01, H=270;           // plan units are centimeters; scene units are meters
const canvas=document.getElementById('c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ loading.textContent='הדפדפן הזה לא תומך ב-WebGL, ולכן אי אפשר להציג את הסיור.'; return; }
const coarse=matchMedia('(pointer:coarse)').matches;

renderer.outputEncoding=THREE.sRGBEncoding;

const ANI=Math.min(8,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.05,900);
camera.rotation.order='YXZ';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(11);

/* ---------- procedural textures ---------- */
function ctex(px,draw,meters,srgb=true){
  const c=document.createElement('canvas');c.width=c.height=px;const g=c.getContext('2d');draw(g,px);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANI;
  if(srgb)t.encoding=THREE.sRGBEncoding; if(meters)t.repeat.set(1/meters,1/meters); return t;
}
function speckle(g,s,n,a,dark){for(let i=0;i<n;i++){const v=dark?20:255;g.fillStyle=`rgba(${v},${v},${v},${a*R()})`;const r=R()*1.6+.4;g.fillRect(R()*s,R()*s,r,r);}}
function grid(g,s,cols,rows,w,col){g.fillStyle=col;for(let i=0;i<=cols;i++)g.fillRect(i*s/cols-w/2,0,w,s);for(let j=0;j<=rows;j++)g.fillRect(0,j*s/rows-w/2,s,w);}

const texFloor=ctex(1024,(g,s)=>{ // 80x80 porcelain, 2x2 tiles per 1.6 m
  const t=s/2;for(let i=0;i<2;i++)for(let j=0;j<2;j++){const k=(R()-.5)*7;g.fillStyle=`rgb(${223+k},${218+k},${210+k})`;g.fillRect(i*t,j*t,t,t);}
  for(let i=0;i<46;i++){const x=R()*s,y=R()*s,r=40+R()*170;const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,R()<.5?'rgba(255,255,255,.05)':'rgba(140,128,110,.045)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  speckle(g,s,9000,.09,true);speckle(g,s,5000,.12,false);grid(g,s,2,2,2.4,'#b4ada2');
},1.6);
const texPlaster=ctex(512,(g,s)=>{g.fillStyle='#ffffff';g.fillRect(0,0,s,s);speckle(g,s,7000,.045,true);},1.5);
const texOak=ctex(1024,(g,s)=>{
  g.fillStyle='#c9a57c';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=2){const a=.04+R()*.12,dark=R()<.6;g.strokeStyle=dark?`rgba(96,62,30,${a})`:`rgba(255,236,206,${a*.7})`;
    g.lineWidth=.6+R()*1.6;g.beginPath();const ph=R()*6.28,amp=1+R()*3,f=(1+Math.floor(R()*3))*Math.PI*2/s;
    for(let x=0;x<=s;x+=16){const yy=y+Math.sin(x*f+ph)*amp;x?g.lineTo(x,yy):g.moveTo(x,yy);}g.stroke();}
  speckle(g,s,3000,.07,true);
},1.0);
const texFab=ctex(256,(g,s)=>{g.fillStyle='#ebebeb';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=2){g.fillStyle=`rgba(0,0,0,${.03+R()*.05})`;g.fillRect(0,y,s,1);}
  for(let x=0;x<s;x+=2){g.fillStyle=`rgba(255,255,255,${.03+R()*.06})`;g.fillRect(x,0,1,s);}speckle(g,s,1600,.12,true);},0.18);
const texBathTile=ctex(1024,(g,s)=>{ // 60x30 glazed tiles
  const cw=s/2,rh=s/4;for(let i=0;i<2;i++)for(let j=0;j<4;j++){const k=(R()-.5)*5;g.fillStyle=`rgb(${241+k},${240+k},${236+k})`;g.fillRect(i*cw,j*rh,cw,rh);}
  speckle(g,s,1800,.05,true);grid(g,s,2,4,3,'#cdc8bf');
},1.2);
const texBathFloor=ctex(512,(g,s)=>{const t=s/2;for(let i=0;i<2;i++)for(let j=0;j<2;j++){const k=(R()-.5)*10;g.fillStyle=`rgb(${148+k},${145+k},${139+k})`;g.fillRect(i*t,j*t,t,t);}
  speckle(g,s,9000,.16,true);speckle(g,s,4000,.12,false);grid(g,s,2,2,2.5,'#6c6863');},0.6);
const texDeck=ctex(1024,(g,s)=>{const n=10,ph=s/n;for(let i=0;i<n;i++){const k=(R()-.5)*22;g.fillStyle=`rgb(${126+k},${97+k},${70+k})`;g.fillRect(0,i*ph,s,ph);
  for(let l=0;l<34;l++){g.fillStyle=`rgba(60,40,20,${R()*.13})`;g.fillRect(0,i*ph+R()*ph,s,1);}g.fillStyle='#382b22';g.fillRect(0,i*ph,s,3);}},1.2);
const texRugA=ctex(1024,(g,s)=>{g.fillStyle='#d9d1c2';g.fillRect(0,0,s,s);speckle(g,s,32000,.1,true);speckle(g,s,16000,.1,false);
  g.strokeStyle='rgba(118,106,88,.55)';g.lineWidth=7;g.strokeRect(52,52,s-104,s-104);g.lineWidth=2;g.strokeRect(74,74,s-148,s-148);});
const texRugB=ctex(1024,(g,s)=>{for(let y=0;y<s;y+=24){g.fillStyle=(y/24)%2?'#5e615c':'#545752';g.fillRect(0,y,s,24);}speckle(g,s,30000,.12,true);speckle(g,s,12000,.08,false);});
const texArt=ctex(1024,(g,s)=>{g.fillStyle='#e6e0d4';g.fillRect(0,0,s,s);
  g.fillStyle='#c7b597';g.beginPath();g.arc(s*.36,s*.46,s*.24,0,7);g.fill();
  g.fillStyle='#4d5b5f';g.fillRect(s*.52,s*.18,s*.28,s*.62);
  g.strokeStyle='#2b2b2b';g.lineWidth=5;g.beginPath();g.moveTo(s*.12,s*.82);g.lineTo(s*.88,s*.82);g.stroke();speckle(g,s,9000,.08,true);});
function facadeTex(lit){return ctex(1024,(g,s)=>{const r=rng(42);g.fillStyle=lit?'#000':'#d8d0c2';g.fillRect(0,0,s,s);if(!lit)speckle(g,s,22000,.07,true);
  const fl=s/4;for(let j=0;j<4;j++)for(let i=0;i<5;i++){const x=i*s/5+22,y=j*fl+24,w=s/5-44,h=fl-62,on=r()<.38;

/* ---------- materials ---------- */
const allMats=[];

const mMirror=M({color:'#ffffff',metalness:1,roughness:.03});
const mCeramic=M({color:'#f7f7f5',roughness:.12});
const mChrome=M({color:'#e6e6e6',metalness:1,roughness:.12});

const mHead=M({map:texFab,color:'#a39b8f',roughness:.95});
const mSeat=M({map:texFab,color:'#7b7266',roughness:.9});

const mRugA=M({map:texRugA,roughness:1});

const mLeaf=M({color:'#3e5a32',roughness:.7});
const mLeaf2=M({color:'#62803f',roughness:.75});

const mSoil=M({color:'#3a2d22',roughness:1});
const mSteelDoor=M({color:'#9a9c98',metalness:.45,roughness:.45});

function worldUV(geo,w,h,d){const uv=geo.attributes.uv;const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];

  if(ev){skyU.top.value.set('#141b33');skyU.hor.value.set('#b97f63');skyU.bot.value.set('#24252b');scene.fog.color.set('#3a3840');}

function applyFov(){let v;if(state.mode==='top')v=45;else{const shortFov=2*Math.atan(12/state.focal);
    v=camera.aspect>=1?shortFov:2*Math.atan(Math.tan(shortFov/2)/camera.aspect);v=Math.min(v,2.2)*180/Math.PI;}
  camera.fov=v;camera.updateProjectionMatrix();}

/* minimap */
const map=document.getElementById('map'),mctx=map.getContext('2d');const MX0=-25,MZ0=-25,MW=1450,MH=830;
let mapStatic=null,mapScale=1,MC={};
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function layer(dpr,fn){const c=document.createElement('canvas');c.width=map.width;c.height=map.height;const g=c.getContext('2d');g.scale(dpr*mapScale,dpr*mapScale);g.translate(-MX0,-MZ0);fn(g);return c;}
function buildMap(){const cssW=map.getBoundingClientRect().width||250,dpr=Math.min(2,devicePixelRatio||1);mapScale=cssW/MW;
  map.width=Math.round(cssW*dpr);map.height=Math.round(MH*mapScale*dpr);map.style.height=(MH*mapScale)+'px';
  MC={floor:cssVar('--map-floor'),room:cssVar('--map-room'),wall:cssVar('--map-wall'),furn:cssVar('--map-furn'),accent:cssVar('--accent')};
  const base=layer(dpr,g=>{g.fillStyle=MC.floor;ROOMS.forEach(rm=>rm.r.forEach(q=>g.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1])));});
  const top=layer(dpr,g=>{g.fillStyle=MC.furn;furnRects.forEach(q=>g.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1]));g.fillStyle=MC.wall;wallRects.forEach(q=>{if(q)g.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1]);});});
  mapStatic={base,top,dpr};}
function drawMap(){if(!mapStatic)return;const {base,top,dpr}=mapStatic,k=dpr*mapScale;
  mctx.setTransform(1,0,0,1,0,0);mctx.clearRect(0,0,map.width,map.height);mctx.drawImage(base,0,0);
  mctx.setTransform(k,0,0,k,-MX0*k,-MZ0*k);
  if(state.room){mctx.fillStyle=MC.room;state.room.r.forEach(q=>mctx.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1]));}
  mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(top,0,0);mctx.setTransform(k,0,0,k,-MX0*k,-MZ0*k);
  const px=state.x*100,pz=state.z*100,a=Math.atan2(-Math.cos(state.yaw),-Math.sin(state.yaw));
  mctx.fillStyle=MC.accent;mctx.globalAlpha=.28;mctx.beginPath();mctx.moveTo(px,pz);mctx.arc(px,pz,170,a-.55,a+.55);mctx.closePath();mctx.fill();
  mctx.globalAlpha=1;mctx.beginPath();mctx.arc(px,pz,30,0,7);mctx.fill();}
map.addEventListener('click',e=>{const b=map.getBoundingClientRect();const x=(e.clientX-b.left)/mapScale+MX0,z=(e.clientY-b.top)/mapScale+MZ0;
  const rm=roomAt(x,z);if(!rm)return;let tx=x*S,tz=z*S;
  if(blocked(tx,tz)){let ok=false;for(let rad=.1;rad<1.2&&!ok;rad+=.1)for(let a=0;a<6.28;a+=.4){const nx=tx+Math.cos(a)*rad,nz=tz+Math.sin(a)*rad;if(!blocked(nx,nz)&&roomAt(nx*100,nz*100)===rm){tx=nx;tz=nz;ok=true;break;}}if(!ok)return;}
  state.x=tx;state.z=tz;setMode('walk');hideHint();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',buildMap);
new MutationObserver(buildMap).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const ptrs=new Map();let pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.focus({preventScroll:true});
  if(ptrs.size===2){const p=[...ptrs.values()];pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&state.mode==='top'){const q=[...ptrs.values()];const d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(pinch0){state.orb.r=Math.max(6,Math.min(32,state.orb.r*pinch0/d));}pinch0=d;return;}
  if(ptrs.size===2&&state.mode==='walk'){const q=[...ptrs.values()];const d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(pinch0)setFocal(state.focal*d/pinch0);pinch0=d;return;}
  if(state.mode==='walk'){state.yaw+=dx*.0042;state.pitch=Math.max(-1.2,Math.min(1.2,state.pitch+dy*.0042));}
  else{state.orb.theta-=dx*.006;state.orb.phi=Math.max(.12,Math.min(1.35,state.orb.phi-dy*.005));}hideHint();});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();if(state.mode==='top')state.orb.r=Math.max(6,Math.min(32,state.orb.r*(1+e.deltaY*.001)));else{setFocal(state.focal*(1-e.deltaY*.0012));hideHint();}},{passive:false});
// joystick
const joy=document.getElementById('joy'),knob=document.getElementById('knob');const jv={x:0,y:0,id:null};
joy.addEventListener('pointerdown',e=>{jv.id=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);hideHint();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jv.id)moveJoy(e);});
const endJoy=e=>{if(e.pointerId!==jv.id)return;jv.id=null;jv.x=jv.y=0;knob.style.transform='';};
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const b=joy.getBoundingClientRect();let x=(e.clientX-(b.left+b.width/2))/(b.width/2-20),y=(e.clientY-(b.top+b.height/2))/(b.height/2-20);
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}jv.x=x;jv.y=-y;knob.style.transform=`translate(${x*(b.width/2-23)}px,${-jv.y*(b.height/2-23)}px)`;}

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;applyFov();buildMap();}
addEventListener('resize',resize);
const clock=new THREE.Clock();let bobT=0;
function tick(){const dt=Math.min(.05,clock.getDelta());
  if(state.mode==='walk'){
    const turn=(keys.has('ArrowLeft')?1:0)-(keys.has('ArrowRight')?1:0);state.yaw+=turn*dt*1.9;
    let f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)+jv.y;
    let st=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+jv.x;const l=Math.hypot(f,st);if(l>1){f/=l;st/=l;}
    const sp=(keys.has('ShiftLeft')||keys.has('ShiftRight')?2.6:1.45)*dt;
    const fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw),rx=Math.cos(state.yaw),rz=-Math.sin(state.yaw);
    const dx=(fx*f+rx*st)*sp,dz=(fz*f+rz*st)*sp;
    if(dx&&!blocked(state.x+dx,state.z))state.x+=dx;if(dz&&!blocked(state.x,state.z+dz))state.z+=dz;
    const moving=l>.05;if(moving)bobT+=dt*8.5;
    camera.position.set(state.x,1.62+(moving?Math.sin(bobT)*.012:0),state.z);camera.rotation.set(state.pitch,state.yaw,0);
  }else{const o=state.orb;camera.position.set(state.tx+o.r*Math.sin(o.phi)*Math.sin(o.theta),o.r*Math.cos(o.phi),state.tz+o.r*Math.sin(o.phi)*Math.cos(o.theta));camera.lookAt(state.tx,0,state.tz);}
  const rm=roomAt(state.x*100,state.z*100);
  if(rm!==state.room){state.room=rm;roomName.textContent=rm?rm.n:'כניסה';roomDims.innerHTML=rm&&rm.d?rm.d.replace(/(\d+ × \d+)/,'<bdi dir="ltr">$1</bdi>')+(/\d/.test(rm.d)?' ס״מ':''):'';
    Object.entries(navBtns).forEach(([k,b])=>b.setAttribute('aria-current',String(!!rm&&rm.k===k)));}
  drawMap();renderer.render(scene,camera);requestAnimationFrame(tick);}

setFocal(state.focal);resize();applyTime(false);
requestAnimationFrame(()=>{tick();loading.remove();});
})();
</script>
